[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openocto"
version = "0.1.0"
description = "Let your AI agent control any terminal, anywhere. Zero config, firewall-proof."
license = "Apache-2.0"
requires-python = ">=3.8"
authors = [{ name = "openOcto contributors" }]
keywords = ["agent", "remote", "terminal", "serverless", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.scripts]
octo = "openocto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
